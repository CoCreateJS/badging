<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CoCreate Badging demo</title>
</head>
<body>
    <main>
        <h1>App badge actions</h1>
        <p>These actions set the installed app icon badge. The app should set or clear it based on its unread state.</p>
        <button type="button" actions="badging.setBadge(3)">Set badge to 3</button>
        <button type="button" actions="badging.setBadge">Set dot badge</button>
        <button type="button" actions="badging.clearBadge">Clear badge</button>
    </main>
    <script src="../dist/CoCreate-badging.js"></script>
</body>
</html>
